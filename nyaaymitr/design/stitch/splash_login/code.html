<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        @keyframes rotate-chakra {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes float-particles {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-100vh) scale(0.5); opacity: 0; }
        }

        .chakra-ring {
            animation: rotate-chakra 60s linear infinite;
        }

        .particle {
            position: absolute;
            bottom: -20px;
            background: #ffdf9f;
            border-radius: 50%;
            pointer-events: none;
            animation: float-particles 10s linear infinite;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .typewriter-text::after {
            content: '|';
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .transition-exit {
            transform: scale(1.1);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .saffron-gradient {
            background: linear-gradient(135deg, #fe6a2a 0%, #ffb59a 100%);
        }
    </style>

<script>
        // Particle System Generation
        function createParticles() {
            const field = document.getElementById('particle-field');
            const particleCount = 25;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 4 + 2;
                const left = Math.random() * 100;
                const delay = Math.random() * 10;
                const duration = Math.random() * 5 + 7;
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${left}%`;
                particle.style.animationDelay = `${delay}s`;
                particle.style.animationDuration = `${duration}s`;
                particle.style.opacity = Math.random() * 0.5 + 0.1;
                
                field.appendChild(particle);
            }
        }

        // Typewriter Effect
        const taglineText = "न्याय आपके द्वार पर";
        const taglineElement = document.getElementById('hindi-tagline');
        let i = 0;

        function typeWriter() {
            if (i < taglineText.length) {
                taglineElement.innerHTML += taglineText.charAt(i);
                i++;
                setTimeout(typeWriter, 150);
            }
        }

        // Tab Switching Logic
        function switchTab(type) {
            const clientTab = document.getElementById('tab-client');
            const advocateTab = document.getElementById('tab-advocate');
            const clientForm = document.getElementById('form-client');
            const advocateForm = document.getElementById('form-advocate');

            if (type === 'client') {
                clientTab.classList.add('bg-secondary-container', 'text-on-secondary');
                clientTab.classList.remove('text-primary-fixed', 'hover:bg-white/5');
                advocateTab.classList.remove('bg-secondary-container', 'text-on-secondary');
                advocateTab.classList.add('text-primary-fixed', 'hover:bg-white/5');
                clientForm.classList.remove('hidden');
                advocateForm.classList.add('hidden');
            } else {
                advocateTab.classList.add('bg-secondary-container', 'text-on-secondary');
                advocateTab.classList.remove('text-primary-fixed', 'hover:bg-white/5');
                clientTab.classList.remove('bg-secondary-container', 'text-on-secondary');
                clientTab.classList.add('text-primary-fixed', 'hover:bg-white/5');
                advocateForm.classList.remove('hidden');
                clientForm.classList.add('hidden');
            }
        }

        // Initialization Animations
        window.addEventListener('DOMContentLoaded', () => {
            createParticles();
            
            // Trigger logo fade-in
            setTimeout(() => {
                document.getElementById('logo-container').style.opacity = '1';
                document.getElementById('logo-container').style.transform = 'scale(1)';
            }, 500);

            // Trigger tagline typewriter
            setTimeout(() => {
                typeWriter();
            }, 1200);

            // Trigger login card slide-up
            setTimeout(() => {
                const card = document.getElementById('login-card');
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 1800);
        });

        // Fake Login Transition
        function handleLogin() {
            const canvas = document.getElementById('app-canvas');
            canvas.classList.add('transition-exit');
            
            setTimeout(() => {
                alert("Redirecting to your personalized legal dashboard...");
                // Reset for demo purposes
                canvas.classList.remove('transition-exit');
            }, 800);
        }
    </script>
